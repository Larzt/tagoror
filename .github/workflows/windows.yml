# Compila Tagoror para Windows y empaqueta el instalador y el ZIP portable.
#
# En cada push a main sirve de aviso de que algo dejó de compilar allí;
# al publicar una etiqueta (v1.3.0), además cuelga los dos ficheros de la release.
#
# release.yml lo llama además con workflow_call para no repetir aquí su build.
# Cuando lo llama, la versión llega como entrada: la release se decide desde
# CMakeLists.txt en un push a main, donde no hay etiqueta de la que sacarla.

name: Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: 'Versión a compilar; si falta se deduce como en un push'
        required: false
        type: string

# El nombre del workflow entra en el grupo, y hace falta: en un push a main que
# además publica, este build corre dos veces -- una por su propio disparador y
# otra llamado por release.yml -- y con el mismo grupo se cancelarían entre
# ellos, tumbando la release. En una llamada, github.workflow es el del que
# llama ("Release"), así que quedan en grupos distintos.
#
# Y solo se cancela el suyo propio: cancelar el de una release a medias deja la
# publicación sin sus ficheros de Windows.
concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.workflow == 'Windows' }}

permissions:
  contents: write

jobs:
  build:
    # windows-latest ha migrado a Windows Server 2025 / VS 2026.
    # Este proyecto usa el generador "Visual Studio 17 2022", así que
    # fijamos explícitamente la imagen que contiene VS 2022.
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      # Inno Setup exige que la versión sea numérica (x.y.z).
      # Fuera de una etiqueta se usa la del propio CMakeLists.
      - name: Averiguar la versión
        id: version
        shell: bash
        # Por variable de entorno y no interpolada dentro del script: así el
        # valor no puede convertirse en código de shell pase lo que pase.
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ -n "$INPUT_VERSION" ]]; then
            version="$INPUT_VERSION"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
          else
            version="$(sed -n 's/^project(tagoror VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)"
          fi

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Versión inválida: $version"
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Versión: $version"

      - name: Instalar Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.9.*'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtmultimedia
          cache: true

      # Diagnóstico temporal para confirmar exactamente qué imagen y
      # qué instalación de Visual Studio está usando el runner.
      - name: Diagnóstico del entorno
        shell: pwsh
        run: |
          Write-Host "=== Runner ==="
          Write-Host "ImageOS: $env:ImageOS"
          Write-Host "ImageVersion: $env:ImageVersion"

          Write-Host ""
          Write-Host "=== CMake ==="
          cmake --version

          Write-Host ""
          Write-Host "=== Visual Studio ==="

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"

          if (-not (Test-Path $vswhere)) {
            throw "No se encontró vswhere: $vswhere"
          }

          Write-Host "vswhere: $vswhere"

          & $vswhere `
            -latest `
            -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath

          & $vswhere `
            -latest `
            -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -format value `
            -property installationVersion

          Write-Host ""
          Write-Host "=== Qt ==="
          Write-Host "QT_ROOT_DIR=[$env:QT_ROOT_DIR]"
          Write-Host "CMAKE_PREFIX_PATH=[$env:CMAKE_PREFIX_PATH]"

          $windeployqt = Join-Path $env:QT_ROOT_DIR "bin\windeployqt.exe"

          if (-not (Test-Path $windeployqt)) {
            throw "No se encontró windeployqt.exe: $windeployqt"
          }

          Write-Host "windeployqt: $windeployqt"

      # Visual Studio 17 2022 encuentra automáticamente la instalación
      # de VS 2022 en windows-2022.
      #
      # Las comillas de TAGOROR_VERSION son importantes: evitan que el
      # valor 1.3.0 sea separado por el shell.
      - name: Configurar
        shell: pwsh
        # El cliente OAuth de Google para la copia en Drive. Si los secretos no
        # existen llegan vacíos y la aplicación sale sin Drive, que compila igual.
        env:
          TAGOROR_GOOGLE_CLIENT_ID: ${{ secrets.TAGOROR_GOOGLE_CLIENT_ID }}
          TAGOROR_GOOGLE_CLIENT_SECRET: ${{ secrets.TAGOROR_GOOGLE_CLIENT_SECRET }}
        run: |
          cmake `
            -B build `
            -G "Visual Studio 17 2022" `
            -A x64 `
            "-DTAGOROR_VERSION=${{ steps.version.outputs.version }}"

      - name: Compilar
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel

      - name: Instalar
        shell: pwsh
        run: |
          cmake --install build --config Release --prefix dist

      # windeployqt copia las DLL de Qt y los plugins necesarios junto al
      # ejecutable.
      - name: Recoger Qt junto al .exe
        shell: pwsh
        run: |
          & "$env:QT_ROOT_DIR\bin\windeployqt.exe" `
            --release `
            --no-translations `
            --no-system-d3d-compiler `
            --no-opengl-sw `
            dist\tagoror.exe

      - name: ZIP portable
        shell: pwsh
        run: |
          Compress-Archive `
            -Path dist\* `
            -DestinationPath "Tagoror-${{ steps.version.outputs.version }}-win64.zip"

      # Inno Setup 6 ya viene en la imagen; solo se instala si faltara.
      - name: Instalador
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"

          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }

          if (-not (Test-Path $iscc)) {
            throw "No se encontró ISCC.exe: $iscc"
          }

          & $iscc `
            "/DMyAppVersion=${{ steps.version.outputs.version }}" `
            "/DStagingDir=${{ github.workspace }}\dist" `
            packaging\windows\tagoror.iss

          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup terminó con código $LASTEXITCODE"
          }

      - name: Guardar los dos paquetes
        uses: actions/upload-artifact@v4
        with:
          name: tagoror-windows-${{ steps.version.outputs.version }}
          path: |
            Tagoror-*-win64.zip
            dist-installer/Tagoror-*-setup.exe
          if-no-files-found: error

      - name: Colgarlos de la release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Tagoror-*-win64.zip
            dist-installer/Tagoror-*-setup.exe
